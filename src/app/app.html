<!-- Global Top Navbar -->
<header class="navbar navbar-expand-lg navbar-dark bg-dark py-2 shadow-sm sticky-top">
  <div class="container-fluid px-4">
    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white fs-5" routerLink="/">
      <span class="brand-icon rounded-3 bg-primary d-flex align-items-center justify-content-center text-white">
        <i class="fa-solid fa-table-cells"></i>
      </span>
      <span>Dynamic Table Forms</span>
    </a>

    <!-- Navigation Route Links -->
    <div class="d-flex align-items-center gap-2 my-2 my-lg-0">
      <ul class="nav nav-pills gap-1">
        <li class="nav-item">
          <a
            class="nav-link py-1 px-3 d-flex align-items-center gap-2 text-white"
            routerLink="/"
            routerLinkActive="active bg-primary"
            [routerLinkActiveOptions]="{ exact: true }">
            <i class="fa-solid fa-layer-group"></i>
            <span>1. Independent Tables (5)</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link py-1 px-3 d-flex align-items-center gap-2 text-white"
            routerLink="/connected"
            routerLinkActive="active bg-primary">
            <i class="fa-solid fa-link text-warning"></i>
            <span>2. Connected Tables (Master + 4 Synced)</span>
            <span class="badge bg-warning text-dark py-0 px-1" style="font-size: 0.68rem;">New</span>
          </a>
        </li>
      </ul>
    </div>

    <!-- Right Side Badges -->
    <div class="d-none d-md-flex align-items-center gap-2">
      <span class="badge bg-secondary-subtle text-light border border-secondary px-2 py-1 small">
        <i class="fa-brands fa-angular me-1 text-danger"></i> Angular Standalone
      </span>
      <span class="badge bg-secondary-subtle text-light border border-secondary px-2 py-1 small">
        <i class="fa-brands fa-bootstrap me-1 text-primary"></i> Bootstrap 5 + FA CDN
      </span>
    </div>
  </div>
</header>

<!-- Routed Content Area -->
<main class="container-fluid px-4 py-4">
  <router-outlet></router-outlet>
</main>
